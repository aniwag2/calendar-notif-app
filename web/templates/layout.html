{{define "layout.html"}}<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Theralert{{end}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body class="h-full text-gray-900">
  {{with .User}}
  <nav class="bg-indigo-700 text-white shadow">
    <div class="mx-auto max-w-7xl px-4 flex items-center justify-between h-16">
      <div class="flex items-center gap-6">
        <a href="/dashboard" class="text-xl font-extrabold tracking-tight">Theralert</a>
        <div class="hidden sm:flex items-center gap-4 text-sm">
          <a href="/dashboard" class="hover:text-indigo-200">Dashboard</a>
          {{if eq .Role "admin"}}<a href="/admin" class="hover:text-indigo-200">Admin</a>{{end}}
          <a href="/profile" class="hover:text-indigo-200">Profile</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="clock"
              hx-get="/clock" hx-trigger="load, every 1s" hx-swap="innerHTML"
              class="font-mono text-sm tabular-nums text-indigo-100"></span>
        <span class="hidden sm:inline text-sm text-indigo-200">{{.Name}} ({{.Role}})</span>
        <form method="post" action="/logout">
          <button class="btn-secondary text-sm py-1.5">Log out</button>
        </form>
      </div>
    </div>
  </nav>
  {{end}}

  <main class="mx-auto max-w-7xl px-4 py-8">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>{{end}}
