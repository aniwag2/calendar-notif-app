{{define "layout.html"}}<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Theralert{{end}}</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="{{cssURL}}">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body class="h-full text-gray-900">
  {{with .User}}
  <nav class="bg-indigo-700 text-white shadow">
    <div class="mx-auto max-w-7xl px-4 flex items-center justify-between h-16">
      <div class="flex items-center gap-6">
        <a href="/dashboard" class="text-xl font-extrabold tracking-tight">Theralert</a>
        <div class="hidden sm:flex items-center gap-4 text-sm">
          <a href="/dashboard" class="hover:text-indigo-200">Dashboard</a>
          <a href="/calendar" class="hover:text-indigo-200">Calendar</a>
          {{if .IsStaffSide}}<a href="/groups" class="hover:text-indigo-200">Groups</a>{{end}}
          {{if eq .Role "admin"}}<a href="/admin" class="hover:text-indigo-200">Admin</a>{{end}}
          <a href="/profile" class="hover:text-indigo-200">Profile</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="clock"
              hx-get="/clock" hx-trigger="load, every 1s" hx-swap="innerHTML"
              class="font-mono text-sm tabular-nums text-indigo-100"></span>
        <a href="/notifications" class="relative hover:text-indigo-200" title="Notifications" aria-label="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
          </svg>
          <span id="bell-badge" hx-get="/notifications/count" hx-trigger="load, every 20s" hx-swap="innerHTML"></span>
        </a>
        <span class="hidden sm:inline text-sm text-indigo-200">{{.Name}} ({{.Role}})</span>
        <form method="post" action="/logout">
          <button class="btn-secondary text-sm py-1.5">Log out</button>
        </form>
      </div>
    </div>
  </nav>
  {{end}}

  <main class="mx-auto max-w-7xl px-4 py-8">
    {{block "content" .}}{{end}}
  </main>

  {{if .User}}
  <div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 no-print"></div>
  <script>
    (function () {
      function bumpBell() {
        if (window.htmx) htmx.ajax('GET', '/notifications/count', { target: '#bell-badge', swap: 'innerHTML' });
      }
      function toast(text) {
        var wrap = document.getElementById('toasts');
        if (!wrap) return;
        var el = document.createElement('div');
        el.className = 'rounded-lg bg-gray-900 text-white text-sm px-4 py-3 shadow-lg max-w-xs animate-pulse';
        el.textContent = text;
        wrap.appendChild(el);
        setTimeout(function () { el.classList.remove('animate-pulse'); }, 1000);
        setTimeout(function () { el.remove(); }, 8000);
      }
      if (window.EventSource) {
        try {
          var es = new EventSource('/sse');
          es.addEventListener('notify', function (e) { toast(e.data); bumpBell(); });
        } catch (err) { /* ignore */ }
      }
    })();
  </script>
  {{end}}
</body>
</html>{{end}}
